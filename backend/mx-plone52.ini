; mxdev configuration used for Plone 5.2 (see Makefile).
;
; Plone 5.2's official release constraints pin plone.restapi==7.9.0, but
; plone.volto 4.x (the last line supporting Plone 5.2) requires
; plone.restapi>=8.13.0. plone.restapi itself keeps working fine on Plone
; 5.2 well past that (per its own CHANGES.md), so we just let it resolve
; freely instead of taking the stale pin from the Plone release constraints.

[settings]
include = mx.ini
ignores =
    plone.restapi
